explorer:
  ros__parameters:
    map_frame: map
    robot_frame: base_footprint
    free_threshold: 25          # occupancy below this counts as free (0-100)
    analysis_resolution: 0.05   # m per cell the map is reduced to before looking for frontiers
    min_frontier_size: 5        # ignore frontiers shorter than this many cells (analysis_resolution each)
    size_weight: 0.5            # >0 prefers long frontiers over short, nearer ones
    clearance: 0.15             # m from obstacles for paths and goals; Burger radius 0.105 + margin
    min_goal_distance: 0.35     # m; nearer cells are no goals (Nav2 goal tolerance is 0.25, it would not move)
    blacklist_radius: 0.5       # m around a failed goal that is not tried again
    blacklist_retries: 1        # times the blacklist is cleared and retried before finishing
    initial_spin: true          # turn 360 degrees first, so SLAM starts with all the surroundings
    max_offmap_spins: 3         # turns while the robot is outside the map before giving up (and saving)
    goal_timeout: 90.0          # s before a goal is cancelled and blacklisted
    goal_frontier_radius: 0.25  # m; a goal counts as explored when no frontier is left this close to it
    settle_time: 3.0           # s after a goal before judging it, the map updates every 2 s
    reject_backoff: 2.0         # s before sending a goal again after Nav2 rejected it (not active yet)
    finish_after_empty_ticks: 5 # consecutive ticks without a frontier before the map is saved
    save_map: true
    map_path: ~/maps/auto_map
    map_save_timeout: 10.0      # s map_saver_cli waits for a map; its default 2 s often fails
    period: 1.0
    # Geofence: the robot stays inside this polygon. Without a value it is drawn in RViz (Publish Point).
    require_geofence: true      # wait for a geofence before the first goal (the initial turn comes first)
    # geofence: [0.0, 0.0, 3.0, 0.0, 3.0, 2.5, 0.0, 2.5]  # x, y of the vertices in the map frame [m]
    geofence_margin: 0.15       # m from the polygon edge that goals and paths keep
    geofence_close_radius: 0.3  # m; a click this close to the first vertex closes the polygon
    keepout_resolution: 0.05    # m per cell of the mask sent to the Nav2 keepout filter
    keepout_ramp: 0.3           # m inside the edge over which Nav2 costs rise towards the line
    keepout_extra: 10.0         # m the mask reaches past the polygon; the costmap is not filtered beyond it
