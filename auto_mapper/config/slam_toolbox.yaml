slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    resolution: 0.05
    max_laser_range: 3.0          # LDS-01 reaches 3.5 m, the last part is noisy
    minimum_time_interval: 0.5
    transform_publish_period: 0.02
    map_update_interval: 2.0
    throttle_scans: 1

    do_loop_closing: true         # corrects the odometry drift of the Burger
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.3
    use_scan_matching: true
    use_scan_barycenter: true
    stack_size_to_use: 40000000
    debug_logging: false
