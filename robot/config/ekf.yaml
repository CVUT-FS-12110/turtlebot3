# robot_localization EKF for the TurtleBot3 Burger (2D, odom frame).
#
# /odom already integrates the IMU heading, so its pose is not fused (that would count the IMU twice).
# The filter takes the wheel forward speed from /odom and the yaw rate (gyro) from /imu and integrates
# them itself. Both inputs come through covariance_fixer.py, because turtlebot3_node publishes zero covariances.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    predict_to_current_time: true   # keeps the odom -> base_footprint transform fresh for SLAM

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: odom_cov
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10

    imu0: imu_cov
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false
